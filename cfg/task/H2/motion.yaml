# @package task

name: motion

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.]
  eye: [3.0, 3.0, 3.0]

robot: 
  name: h2
terrain: plane

num_envs: 4096
max_episode_length: 1000

sim:
  step_dt: 0.02
  isaac_physics_dt: 0.005
  mujoco_physics_dt: 0.002

action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling:
    .*hip.*: 0.5
    .*knee.*: 0.5
    .*ankle_pitch.*: 0.5
    torso_joint: 0.5
    .*shoulder.*: 0.5
    .*elbow.*: 0.5
  max_delay: 1
  alpha: [0.6, 0.8]

command:
  _target_: active_adaptation.envs.mdp.MotionLibH2
  motion_clip_dir: "scripts/data"
  dataset: amass_train_h2
  occlusion: "amass_copycat_occlusion_v3.pkl"
  joint_matches: [
    ["left_hip_yaw_link", "L_Hip"],
    ["left_knee_link", "L_Knee"],
    ["left_ankle_roll_link", "L_Ankle"],
    ["right_hip_yaw_link", "R_Hip"],
    ["right_knee_link", "R_Knee"],
    ["right_ankle_roll_link", "R_Ankle"],
    ["left_shoulder_pitch_link", "L_Shoulder"],
    ["left_elbow_link", "L_Elbow"],
    ["left_wrist_yaw_link", "L_Hand"],
    ["right_shoulder_pitch_link", "R_Shoulder"],
    ["right_elbow_link", "R_Elbow"],
    ["right_wrist_yaw_link", "R_Hand"]
  ]
  mode: train
  eval_id: null
  
observation:
  robot:
    root_quat_w:
    root_angvel_b:        {noise_std: 0.05}
    projected_gravity_b:  {noise_std: 0.01}
    joint_pos:            {noise_std: 0.05}
    joint_vel:            {noise_std: 0.2}
    body_pos:             {body_names: [left_hip_yaw_link, left_knee_link, left_ankle_roll_link, 
                                        right_hip_yaw_link, right_knee_link, right_ankle_roll_link,
                                        left_shoulder_pitch_link, left_elbow_link, left_wrist_yaw_link, 
                                        right_shoulder_pitch_link, right_elbow_link, right_wrist_yaw_link], 
                                        yaw_only: false}
    prev_actions:         {steps: 1}
  ref_motion_:
    ref_orientation:      {steps: 25}
    ref_height:           {steps: 25}
    ref_qpos:             { joint_names: [.*hip_pitch.*, torso_joint, 
                                            .*hip_roll.*, .*hip_yaw.*, .*knee.*,
                                            .*shoulder_pitch.*, 
                                            .*ankle_pitch.*,  
                                            .*shoulder_roll.*, .*shoulder_yaw.*,
                                             .*elbow.*],
                            steps: 25}
    ref_keypoints:        {steps: 25}
    ref_keypoints_gap:    { body_names: [left_hip_yaw_link, left_knee_link, left_ankle_roll_link, 
                                        right_hip_yaw_link, right_knee_link, right_ankle_roll_link,
                                        left_shoulder_pitch_link, left_elbow_link, left_wrist_yaw_link, 
                                        right_shoulder_pitch_link, right_elbow_link, right_wrist_yaw_link],
                            steps: 25}
    ref_trans_gap:        {steps: 25}
  priv:
    root_height:      {}
    root_linvel_b:    {}
    body_vel:         {body_names: [left_hip_yaw_link, left_knee_link, left_ankle_roll_link, 
                                        right_hip_yaw_link, right_knee_link, right_ankle_roll_link,
                                        left_shoulder_pitch_link, left_elbow_link, left_wrist_yaw_link, 
                                        right_shoulder_pitch_link, right_elbow_link, right_wrist_yaw_link], 
                                        yaw_only: false}
    # joint_forces:     {}

reward:
  loco:
    tracking_root_trans:    {weight: 2., enabled: true}
    tracking_root_rot:      {weight: 2., enabled: true}
    tracking_qpos:          {weight: 2., enabled: true,
                              joint_names: [.*hip_pitch.*, torso_joint, 
                                            .*hip_roll.*, .*hip_yaw.*, .*knee.*,
                                            .*shoulder_pitch.*, 
                                            .*ankle_pitch.*,    
                                            .*shoulder_roll.*, .*shoulder_yaw.*,
                                             .*elbow.*]}
    tracking_keypoints:     {weight: 3., enabled: true,
                              body_names: [left_hip_yaw_link, left_knee_link,
                                        right_hip_yaw_link, right_knee_link,
                                        left_shoulder_pitch_link, left_elbow_link, 
                                        right_shoulder_pitch_link, right_elbow_link]}
    tracking_eff:           {weight: 4., enabled: true,
                              body_names: [left_ankle_roll_link, left_wrist_yaw_link,
                                        right_ankle_roll_link, right_wrist_yaw_link]}
    tracking_contact:       {weight: 2., enabled: true}

    # feet_orientation:   {weight: 0.5, enabled: true, feet_names: .*ankle_roll_link, body_name: pelvis}
    feet_slip:          {weight: 1.0, enabled: true, body_names: .*ankle_roll_link}

    action_rate_l2:     {weight: 0.25, enabled: true}

randomization:
  push:
    body_names: ["torso_link", "pelvis"]
    force_range: [0.0, 0.1]
  perturb_body_mass:
    ".*wrist_yaw_link": [1.0, 2.0]
    "^(?!.*wrist_yaw_link).*": [0.9, 1.1]
    # .*: [0.9, 1.1]
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.6, 4.0]
    dynamic_friction_range: [0.6, 4.0]
    restitution_range: [0.0, 0.2]
  motor_params_implicit:
    stiffness_range:
      .*: [0.8, 1.1]
    damping_range:
      .*: [0.8, 1.1]
    armature_range:
      .*: [0.0, 0.01]
  reset_joint_states_uniform:
    pos_ranges:
      .*: [-0.1, 0.1]
    rel: true

termination:
  # dummy: {}
  root_deviation: {max_distance: 0.4}
  root_rot_deviation: {max_theta: 30}
  track_kp_error: {max_distance: 0.5, 
                  body_names: [ left_wrist_yaw_link, right_wrist_yaw_link,
                                left_ankle_roll_link, right_ankle_roll_link]}
